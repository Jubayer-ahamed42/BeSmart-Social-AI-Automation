name: Facebook Page 24/7 Autonomous Poster

on:
  schedule:
    # Primary: 6:55 AM BST (00:55 UTC) & Catch-up: 7:15 AM BST (01:15 UTC) -> Morning AI (07:00 AM BST Target)
    - cron: '55 0 * * *'
    - cron: '15 1 * * *'
    # Primary: 11:55 AM BST (05:55 UTC) & Catch-up: 12:15 PM BST (06:15 UTC) -> Noon Tech (12:00 PM BST Target)
    - cron: '55 5 * * *'
    - cron: '15 6 * * *'
    # Primary: 3:55 PM BST (09:55 UTC) & Catch-up: 4:15 PM BST (10:15 UTC) -> Afternoon Security (04:00 PM BST Target)
    - cron: '55 9 * * *'
    - cron: '15 10 * * *'
    # Primary: 7:55 PM BST (13:55 UTC) & Catch-up: 8:15 PM BST (14:15 UTC) -> Night Science (08:00 PM BST Target)
    - cron: '55 13 * * *'
    - cron: '15 14 * * *'
  
  # ম্যানুয়াল ট্রিগারের জন্য (যে কোনো সময় রান বা টেস্ট করার সুবিধা)
  workflow_dispatch:
    inputs:
      slot:
        description: 'পোস্টের স্লট নির্বাচন করুন'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - noon
          - afternoon
          - night
      dry_run:
        description: 'ড্রাই-রান মোড (ফেসবুকে পোস্ট হবে না, শুধু টেস্ট হবে)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  auto_post:
    name: Generate & Post Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIMEZONE: Asia/Dhaka
          PYTHONIOENCODING: utf-8
        run: |
          SLOT_PARAM="auto"
          DRY_RUN_PARAM=""
          FORCE_PARAM=""
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "55 0 * * *"|"15 1 * * *")  SLOT_PARAM="morning" ;;
              "55 5 * * *"|"15 6 * * *")  SLOT_PARAM="noon" ;;
              "55 9 * * *"|"15 10 * * *") SLOT_PARAM="afternoon" ;;
              "55 13 * * *"|"15 14 * * *") SLOT_PARAM="night" ;;
              *)                          SLOT_PARAM="auto" ;;
            esac
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.slot }}" ]; then
              SLOT_PARAM="${{ inputs.slot }}"
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_RUN_PARAM="--dry-run"
            fi
            FORCE_PARAM="--force"
          fi
          
          echo "Executing auto poster with slot: $SLOT_PARAM (Dry-run: $DRY_RUN_PARAM, Trigger: ${{ github.event_name }})"
          python main.py --slot "$SLOT_PARAM" $DRY_RUN_PARAM $FORCE_PARAM

      - name: Commit and Push Updated Post History
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update post history [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No history changes to commit."
          fi
